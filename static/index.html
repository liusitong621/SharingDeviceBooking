<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed">
  <title>设备借用 · 制度问答</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/user.css">
</head>
<body class="u-body">
<a class="skip" href="#main">跳到主要内容</a>

<!-- 员工端外壳：顶部品牌条 + 三格导航，与 /devices、/bookings 完全一致。
     这一页不走服务端渲染（原生 JS + SSE），壳是手写的同一套类名，
     不引入第二个模板引擎。注意这里只能用 HTML 注释：静态文件不过 Jinja，
     {# #} 会被原样输出到页面顶部。 -->
<header class="u-top">
  <div class="u-brand">
    <div class="logo" aria-hidden="true">借</div>
    <div class="u-brand-text">
      <strong>设备借用</strong>
      <small>员工端</small>
    </div>
  </div>

  <div class="u-top-right">
    <span class="tag" id="degraded-badge" hidden>降级模式</span>
    <a class="u-link" id="me-admin" href="/admin" hidden>管理端 →</a>
    <div class="u-who">
      <span id="me-name">加载中…</span>
      <small id="me-sub"></small>
    </div>
    <button type="button" id="btn-logout" class="u-out">退出</button>
  </div>
</header>

<nav class="u-tab" aria-label="员工端导航">
  <div class="u-tab-inner">
    <a href="/" class="on" aria-current="page">制度问答</a>
    <a href="/devices">设备空档</a>
    <a href="/bookings">我的预约</a>
  </div>
</nav>

<main class="main" id="main">
  <header class="topbar">
    <div class="titles">
      <h1>制度问答</h1>
      <p>可问：借用时段 · 取消规则 · 设备下架 · 取还登记</p>
    </div>
    <div class="topbar-tools">
      <span class="kb-line">
        知识库 <b id="kb-state">检查中…</b><span class="dot">·</span>模型 <b id="llm-state">—</b>
      </span>
      <button id="new-chat" class="btn-new" type="button">
        <span aria-hidden="true">＋</span> 新对话
      </button>
    </div>
  </header>

  <div class="messages" id="messages" role="log" aria-live="polite" aria-label="对话记录">
    <!-- 空态：给四个可直接点击的示例问题，降低首次使用门槛 -->
    <div class="empty" id="empty-state">
      <h2>问点什么</h2>
      <p>以下问题可以直接点，也可以自己输入</p>
      <div class="samples">
        <button class="sample" type="button">每天最多可以预约几格？</button>
        <button class="sample" type="button">取消预约后别人能马上约同一格吗？</button>
        <button class="sample" type="button">设备坏了怎么下架，员工能自己改状态吗？</button>
        <button class="sample" type="button">预约了没去会怎么样？</button>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="status-line" id="status-line" hidden role="status">
      <span class="spinner" aria-hidden="true"></span><span id="status-text">正在检索制度…</span>
    </div>

    <form id="form">
      <textarea id="input" rows="1" maxlength="500" aria-label="输入问题"
                placeholder="输入你的问题，Enter 发送"></textarea>
      <button id="send" class="send" type="submit">发送</button>
    </form>

    <div class="hint">
      <span id="counter">0 / 500</span>
      <span class="hint-key">Enter 发送 · Shift + Enter 换行</span>
      <span>回答附引用来源，点开可核对原文</span>
    </div>
  </div>
</main>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
