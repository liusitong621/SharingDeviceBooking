name: CI

# 只做一件事：证明 README 里"130 项单测 + R01–R08 逐条核对"不是写在文档里的形容词。
#
# 为什么不在这里跑 examples/demo.py 和 seed_demo.py：
# 那两个脚本会写临时库、耗时几十秒，属于演示工具，不是回归门禁。
# 门禁要快、要稳、要只因为代码坏了才红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 单测 + 需求自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 固定 3.12，是 requirements.txt 声明的最低支持版本（下限由 numpy 2.5.x 的
          # Requires-Python >=3.12 决定，不是由本项目语法决定）。
          #
          # 曾经写的是 3.11，理由是「faiss wheel 对小版本支持慢一档，用最低版本更早
          # 暴露兼容问题」。这个理由本身没错，但 3.11 已经低于依赖的下限了，
          # 结果不是"暴露兼容问题"，而是 pip 直接装不上 numpy——红得没有信息量。
          # 现在下限有据可查地是 3.12，CI 就钉在 3.12；本地开发用 3.13。
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 依赖自检
        # 只装得上不等于能用：requirements.txt 里锁死版本就是为了防 faiss 与 numpy
        # 的 C ABI 漂移，而 ABI 不匹配的表现是 import 时 "undefined symbol"，
        # 不是安装时报错。这一步把那个失败提前到装完立刻发生，日志也更短。
        # 顺带守住解释器下限——3.11 那次就是版本不够被 pip 报成"找不到 numpy"。
        run: python scripts/check_deps.py

      - name: 单元测试（130 项）
        run: python -m unittest discover -s tests -v

      - name: 需求自检（R01–R08）
        # 退出码非零即失败：verify.py 在任何一条断言不过时返回 1。
        run: python scripts/verify.py
