<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · 设备借用</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">借</div>
      <div>
        <strong>{% if forced %}设置新密码{% else %}修改密码{% endif %}</strong>
        <small>{{ user.name }} · {{ user.emp_no }}</small>
      </div>
    </div>

    {% if forced %}
    <div class="alert info">首次登录，请先设置自己的密码。设置完成后才能进入系统。</div>
    {% endif %}
    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/change-password">
      <input type="hidden" name="_csrf" value="{{ csrf }}">

      <div class="field">
        <label for="old_password">当前密码</label>
        <input id="old_password" name="old_password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="field">
        <label for="new_password">新密码</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password"
               placeholder="至少 8 位，不能是纯数字" required>
      </div>
      <div class="field">
        <label for="confirm_password">确认新密码</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn primary">保存并继续</button>
    </form>

    <div class="auth-foot">
      密码规则只有三条：至少 8 位、不能全为数字、不使用常见弱口令。
      规则刻意保守——过度复杂的要求会让人写在便签上贴在显示器边。
    </div>
  </div>
</div>
</body>
</html>
